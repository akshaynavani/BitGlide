# BitGlide sample configuration. Pass with: bitglide --config config/default.conf <url>
abr = hybrid
workers = 2
lookahead = 3
max-buffer = 30
max-retries = 2
abandon-slow = true

safety-factor = 0.85
upswitch-factor = 1.15
panic-buffer = 3
upswitch-buffer = 8

ewma-fast = 3
ewma-slow = 9
initial-bw = 1000000

startup-buffer = 4
resume-buffer = 4
log-level = info
